<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root { --bg:#eef3f9; --card:#fff; --ink:#12314f; --muted:#5d7791; --line:#d5e2ef; --brand:#0b4b8a; --soft:#e3edf8;
  --ok:#1b7f4b; --ok-soft:#e3f4ea; --warn:#9a5b00; --warn-soft:#fff4e0; --bad:#b4232c; --bad-soft:#fdecee;
  --f:"Tajawal","Segoe UI","Noto Sans Arabic",Tahoma,sans-serif; --mono:ui-monospace,Menlo,Consolas,monospace; }
* { box-sizing:border-box }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 var(--f); }
.top { background:var(--brand); color:#fff; padding:14px max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left)); }
.top h1 { margin:0; font-size:1.3rem; font-weight:800 } .top p { margin:0; opacity:.8; font-size:.85rem }
.tabs { display:flex; gap:4px; margin-top:10px; overflow-x:auto }
.tabs button { font:inherit; font-weight:700; color:#cfe0f3; background:none; border:0; padding:10px 14px; border-radius:12px 12px 0 0; cursor:pointer; white-space:nowrap }
.tabs button.on { background:var(--bg); color:var(--brand) }
main { max-width:760px; margin:0 auto; padding:16px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left)); display:flex; flex-direction:column; gap:14px }
.card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px; display:flex; flex-direction:column; gap:12px }
.card h2 { margin:0; font-size:1.05rem; font-weight:800 }
.note { margin:0; color:var(--muted); font-size:.9rem }
.row { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end }
.row > * { flex:1 1 180px; min-width:0 }
label { display:flex; flex-direction:column; gap:5px; font-weight:700; font-size:.88rem }
input, textarea, select { font:inherit; color:var(--ink); background:var(--bg); border:1.5px solid var(--line); border-radius:12px; padding:9px 12px; width:100% }
textarea { resize:vertical; min-height:90px }
.ltr { direction:ltr; text-align:right; font-family:var(--mono) }
.btn { font:inherit; font-weight:800; border:0; border-radius:12px; padding:11px 16px; cursor:pointer; background:var(--brand); color:#fff; text-decoration:none; text-align:center; display:inline-flex; justify-content:center; align-items:center; gap:6px }
.btn.soft { background:var(--soft); color:var(--brand) } .btn.ok { background:var(--ok) } .btn.bad { background:var(--bad-soft); color:var(--bad) }
.btn.sm { padding:6px 12px; font-size:.85rem } .btn[disabled], .btn[aria-busy] { opacity:.55; pointer-events:none }
button:focus-visible, input:focus-visible, a:focus-visible, select:focus-visible, textarea:focus-visible { outline:3px solid #f0c24b; outline-offset:2px }
.stats { display:grid; grid-template-columns:repeat(4,1fr); gap:8px }
@media (max-width:480px) { .stats { grid-template-columns:repeat(2,1fr) } }
.stats div { background:var(--bg); border-radius:14px; padding:10px 6px; text-align:center; display:flex; flex-direction:column }
.stats b { font-size:1.4rem; color:var(--brand); font-variant-numeric:tabular-nums } .stats span { font-size:.78rem; color:var(--muted) }
.stats .bad b { color:var(--bad) }
.dev { display:flex; gap:12px; align-items:center; padding:12px 14px; border-radius:14px; background:var(--bad-soft) }
.dev.on { background:var(--ok-soft) } .dot { width:12px; height:12px; border-radius:50%; background:var(--bad); flex:none } .dev.on .dot { background:var(--ok) }
.dev .t { display:flex; flex-direction:column; min-width:0 } .dev small { color:var(--muted) }
ul.list { list-style:none; margin:0; padding:0; display:flex; flex-direction:column }
ul.list li { display:flex; gap:10px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); flex-wrap:wrap }
ul.list li:last-child { border-bottom:0 }
.grow { flex:1 1 200px; min-width:0; display:flex; flex-direction:column } .grow small { color:var(--muted); overflow-wrap:anywhere }
.chip { border-radius:999px; padding:2px 10px; font-size:.8rem; font-weight:700; background:var(--soft); color:var(--brand); white-space:nowrap }
.c-pending { background:var(--warn-soft); color:var(--warn) } .c-sent { background:var(--ok-soft); color:var(--ok) }
.c-failed, .c-no_phone { background:var(--bad-soft); color:var(--bad) } .c-cancelled { background:var(--bg); color:var(--muted) }
.phone { width:150px; flex:none } .phone.has { border-color:var(--ok); background:var(--ok-soft) } .phone.bad { border-color:var(--bad) }
.toast { position:fixed; bottom:calc(16px + env(safe-area-inset-bottom)); inset-inline:16px; margin:auto; max-width:520px; padding:12px 16px; border-radius:14px; background:var(--ink); color:#fff; font-weight:700; z-index:50 }
.toast.err { background:var(--bad) }
.key { font:800 1.5rem/1 var(--mono); letter-spacing:.1em; text-align:center; padding:12px; border:2px dashed var(--brand); border-radius:14px; color:var(--brand); background:var(--soft) }
.switch { display:flex; flex-direction:row; gap:10px; align-items:center; font-weight:800 } .switch input { width:22px; height:22px }
[hidden] { display:none !important }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
var S = { token: null, tab: 'today', date: '', cls: '' };
try { S.token = localStorage.getItem('sms_token'); } catch (e) {}
var $ = function (s, r) { return (r || document).querySelector(s); }, $$ = function (s, r) { return [].slice.call((r || document).querySelectorAll(s)); };
function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function toast(m, err) { var t = $('#toast'); t.textContent = m; t.className = 'toast' + (err ? ' err' : ''); t.hidden = false; clearTimeout(t._t); t._t = setTimeout(function () { t.hidden = true; }, 4000); }
function api(action, payload) {
  return new Promise(function (ok, no) {
    google.script.run.withSuccessHandler(function (r) {
      if (r && r.auth) { S.token = null; try { localStorage.removeItem('sms_token'); } catch (e) {} render(); return no(new Error(r.error)); }
      r && r.ok ? ok(r.data) : no(new Error(r && r.error || 'خطأ غير معروف.'));
    }).withFailureHandler(function () { no(new Error('تعذر الاتصال. تحقق من الإنترنت.')); }).api(action, S.token, payload || {});
  });
}
function normPhone(v) {
  var d = String(v == null ? '' : v).replace(/[٠-٩]/g, function (c) { return String(c.charCodeAt(0) - 0x660); }).replace(/[^\d+]/g, '');
  d = d.replace(/^\+213/, '0').replace(/^00213/, '0').replace(/^213(?=[567]\d{8}$)/, '0');
  if (/^[567]\d{8}$/.test(d)) d = '0' + d;
  return /^0[567]\d{8}$/.test(d) ? d : '';
}
function shell(body) {
  var tabs = [['today', 'اليوم'], ['parents', 'هواتف الأولياء'], ['settings', 'الإعدادات']];
  $('#app').innerHTML = '<div class="top"><h1>رسائل الأولياء</h1><p>متوسطة الشهيد بدراني بوعمامة — تقرأ الغيابات من دفتر الغيابات</p>' +
    (S.token ? '<div class="tabs" role="tablist">' + tabs.map(function (t) { return '<button role="tab" data-tab="' + t[0] + '" class="' + (S.tab === t[0] ? 'on' : '') + '">' + t[1] + '</button>'; }).join('') +
      '<button data-logout style="margin-inline-start:auto">خروج</button></div>' : '<div style="height:12px"></div>') + '</div><main>' + body + '</main>';
}
document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-tab]'); if (t) { S.tab = t.getAttribute('data-tab'); render(); return; }
  if (e.target.closest('[data-logout]')) { S.token = null; try { localStorage.removeItem('sms_token'); } catch (x) {} render(); }
});

/* ---------- الدخول ---------- */
function loginView() {
  shell('<form class="card" id="lf"><h2>دخول المدير</h2><p class="note">بنفس البريد وكلمة المرور الخاصين بحساب المدير في دفتر الغيابات.</p>' +
    '<label>البريد الإلكتروني<input name="email" type="email" dir="ltr" required autocomplete="username"></label>' +
    '<label>كلمة المرور<input name="password" type="password" dir="ltr" required autocomplete="current-password"></label>' +
    '<button class="btn">دخول</button></form>');
  $('#lf').onsubmit = function (e) {
    e.preventDefault(); var b = $('button', this); b.setAttribute('aria-busy', '1');
    api('login', { email: this.email.value, password: this.password.value }).then(function (d) {
      S.token = d.token; try { localStorage.setItem('sms_token', d.token); } catch (x) {} render();
    }).catch(function (er) { b.removeAttribute('aria-busy'); toast(er.message, 1); });
  };
}

/* ---------- اليوم ---------- */
var ST = { pending: 'في الانتظار', sending: 'قيد الإرسال', sent: 'أُرسلت', failed: 'فشلت', cancelled: 'أُلغيت', no_phone: 'بدون هاتف' };
function todayView() {
  shell('<div class="card"><p class="note">جارٍ التحميل…</p></div>');
  api('status', { date: S.date }).then(function (d) {
    var on = d.seen_ago !== null && d.seen_ago < 180;
    var ago = d.seen_ago === null ? 'لم يتصل بعد' : d.seen_ago < 90 ? 'متصل الآن' : d.seen_ago < 3600 ? 'آخر اتصال قبل ' + Math.round(d.seen_ago / 60) + ' دقيقة' : 'آخر اتصال: ' + esc(d.seen.substr(0, 16));
    var s = d.stats, h = '';
    if (!d.daftar_ok) h += '<div class="card" style="background:var(--bad-soft)"><b>ملف دفتر الغيابات غير محدد.</b><p class="note">افتح «الإعدادات» والصق رابط ملف «دفتر الغيابات — قاعدة البيانات».</p></div>';
    h += '<div class="card"><div class="row" style="align-items:center"><h2>' + (d.enabled ? '✓ الرسائل مفعّلة' : '✗ الرسائل موقوفة') + '</h2>' +
      '<button class="btn sm ' + (d.enabled ? 'bad' : 'ok') + '" id="tog" style="flex:none">' + (d.enabled ? 'إيقاف' : 'تفعيل') + '</button></div>' +
      '<div class="dev ' + (on ? 'on' : '') + '"><span class="dot"></span><span class="t"><b>' + esc(d.device || 'هاتف المؤسسة') + '</b><small>' + ago + '</small></span></div>' +
      '<div class="stats"><div><b>' + (s.sent || 0) + '</b><span>أُرسلت</span></div><div><b>' + ((s.pending || 0) + (s.sending || 0)) + '</b><span>في الانتظار</span></div>' +
      '<div class="' + (s.failed ? 'bad' : '') + '"><b>' + (s.failed || 0) + '</b><span>فشلت</span></div><div class="' + (s.no_phone ? 'bad' : '') + '"><b>' + (s.no_phone || 0) + '</b><span>بدون هاتف</span></div></div>' +
      '<p class="note">' + d.with_phone + ' من ' + d.total + ' تلميذ لهم هاتف ولي. تُجهَّز الرسالة بعد نهاية الحصة بـ 10 دقائق (مهلة تصحيح الأستاذ)، وتُرسل رسالة كل دقيقة ونصف.</p>' +
      (d.scan_err ? '<p class="note" style="color:var(--bad)">' + esc(d.scan_err) + '</p>' : '') + '</div>';
    h += '<div class="card"><div class="row"><h2 style="flex:1 1 auto">رسائل يوم</h2><input type="date" id="dt" value="' + esc(d.date) + '" style="flex:0 1 180px"></div>' +
      '<div class="row" style="flex:0">' + (s.failed ? '<button class="btn sm soft" data-op="retry" style="flex:none">إعادة إرسال الفاشلة</button>' : '') +
      (s.pending ? '<button class="btn sm bad" data-op="cancel" style="flex:none">إلغاء المنتظرة</button>' : '') + '</div>';
    h += d.list.length ? '<ul class="list">' + d.list.map(function (r) {
      return '<li><span class="grow"><b>' + esc(r.name) + (r.label ? ' <span class="chip">' + esc(r.label) + '</span>' : '') + (r.kind === 'test' ? ' <span class="chip">تجربة</span>' : '') + '</b>' +
        '<small class="ltr">' + esc(r.phone || '—') + ' · ' + esc(r.time) + '</small><small>' + esc(r.text) + '</small>' +
        (r.error && r.status !== 'sent' ? '<small style="color:var(--bad)">' + esc(r.error) + '</small>' : '') + '</span>' +
        '<span class="chip c-' + r.status + '">' + (ST[r.status] || r.status) + '</span>' +
        (r.status === 'pending' ? '<button class="btn sm bad" data-op="cancel_one" data-id="' + r.id + '">إلغاء</button>' : '') + '</li>';
    }).join('') + '</ul>' : '<p class="note">لا توجد رسائل في هذا اليوم.</p>';
    shell(h + '</div>');
    $('#dt').onchange = function () { S.date = this.value; render(); };
    $('#tog').onclick = function () { api('saveSettings', { enabled: !d.enabled }).then(function (r) { toast(r.message); render(); }).catch(function (e) { toast(e.message, 1); }); };
    $$('[data-op]').forEach(function (b) { b.onclick = function () { api('action', { op: b.getAttribute('data-op'), id: b.getAttribute('data-id') }).then(function (r) { toast(r.message); render(); }).catch(function (e) { toast(e.message, 1); }); }; });
    clearTimeout(S.refresh); S.refresh = setTimeout(function () { if (S.tab === 'today' && S.token) render(); }, 45000);
  }).catch(function (e) { shell('<div class="card"><p class="note" style="color:var(--bad)">' + esc(e.message) + '</p></div>'); });
}

/* ---------- هواتف الأولياء ---------- */
function parentsView() {
  shell('<div class="card"><p class="note">جارٍ تحميل التلاميذ من دفتر الغيابات…</p></div>');
  api('students').then(function (d) {
    S.students = d.students;
    var classes = []; d.students.forEach(function (s) { if (classes.indexOf(s.label) < 0) classes.push(s.label); });
    if (!S.cls || classes.indexOf(S.cls) < 0) S.cls = classes[0] || '';
    var withP = d.students.filter(function (s) { return s.phone; }).length;
    var h = '<div class="card"><h2>استيراد من ملف Excel</h2><p class="note">ملف فيه عمود <b>رقم التعريف</b> وعمود <b>هاتف الولي</b> (يكفي الاسم إن لم يوجد رقم التعريف). يُربط كل رقم بالتلميذ تلقائيا.</p>' +
      '<div class="row"><input type="file" id="xf" accept=".xlsx,.xls,.csv"><button class="btn soft" id="xr" style="flex:0 0 auto">قراءة الملف</button></div><div id="xprev"></div></div>';
    h += '<div class="card"><div class="row"><h2 style="flex:1 1 auto">الإدخال اليدوي <span class="chip">' + withP + ' / ' + d.students.length + '</span></h2>' +
      '<select id="cls" style="flex:0 1 160px">' + classes.map(function (c) { var n = d.students.filter(function (s) { return s.label === c; }), k = n.filter(function (s) { return s.phone; }).length;
        return '<option value="' + esc(c) + '"' + (c === S.cls ? ' selected' : '') + '>' + esc(c) + ' (' + k + '/' + n.length + ')</option>'; }).join('') + '</select></div>' +
      '<ul class="list" id="pl">' + d.students.filter(function (s) { return s.label === S.cls; }).map(function (s, i) {
        return '<li><span class="grow"><b>' + (i + 1) + '. ' + esc(s.name) + '</b><small class="ltr">' + esc(s.nid || 'بدون رقم تعريف') + '</small></span>' +
          '<input class="phone ltr' + (s.phone ? ' has' : '') + '" inputmode="tel" placeholder="06xxxxxxxx" data-id="' + esc(s.id) + '" data-old="' + esc(s.phone) + '" value="' + esc(s.phone) + '" aria-label="هاتف ولي ' + esc(s.name) + '"></li>';
      }).join('') + '</ul><button class="btn" id="ps">حفظ هواتف هذا القسم</button></div>';
    shell(h);
    $('#cls').onchange = function () { S.cls = this.value; parentsView(); };
    $$('.phone').forEach(function (i) { i.oninput = function () { var v = i.value.trim(); i.classList.toggle('bad', !!v && !normPhone(v)); i.classList.toggle('has', !!normPhone(v)); }; });
    $('#ps').onclick = function () {
      var items = [], bad = 0;
      $$('.phone').forEach(function (i) { var v = i.value.trim(), n = normPhone(v); if (v && !n) { bad++; return; } if (n !== i.getAttribute('data-old')) items.push({ id: i.getAttribute('data-id'), phone: n }); });
      if (bad) return toast(bad + ' رقم غير صحيح (بالأحمر). الرقم النقال: 05/06/07 + 8 أرقام.', 1);
      if (!items.length) return toast('لا يوجد تغيير.');
      var b = this; b.setAttribute('aria-busy', '1');
      api('savePhones', { items: items }).then(function (r) { toast(r.message); parentsView(); }).catch(function (e) { b.removeAttribute('aria-busy'); toast(e.message, 1); });
    };
    $('#xr').onclick = readExcel;
  }).catch(function (e) { shell('<div class="card"><p class="note" style="color:var(--bad)">' + esc(e.message) + '</p></div>'); });
}

function nrm(s) { return String(s || '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/[ًٌٍَُِّْـ]/g, '').replace(/\s+/g, ' ').trim().toLowerCase(); }
function readExcel() {
  var f = $('#xf').files[0]; if (!f) return toast('اختر الملف أولا.', 1);
  if (typeof XLSX === 'undefined') return toast('تعذر تحميل أداة قراءة Excel. تحقق من الإنترنت.', 1);
  var fr = new FileReader();
  fr.onload = function () {
    try {
      var wb = XLSX.read(new Uint8Array(fr.result), { type: 'array' }), found = [];
      wb.SheetNames.forEach(function (sn) {
        var rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, raw: false, defval: '' });
        var hr = -1, cN = -1, cP = -1, cName = -1, cLast = -1, cFirst = -1;
        for (var r = 0; r < Math.min(rows.length, 30) && hr < 0; r++) {
          rows[r].forEach(function (v, c) {
            var n = nrm(v);
            if (/تعريف|matricule|identifiant/.test(n)) cN = c;
            else if (/هاتف|جوال|نقال|tel|mobile|phone|portable|gsm/.test(n)) cP = c;
            else if (/الاسم واللقب|الاسم و اللقب|اللقب والاسم|اسم التلميذ|اسم التلميد|nom et prenom|nom complet/.test(n)) cName = c;
            else if (n === 'اللقب' || n === 'nom') cLast = c; else if (n === 'الاسم' || n === 'prenom') cFirst = c;
          });
          if (cP >= 0 && (cN >= 0 || cName >= 0 || cLast >= 0)) hr = r; else { cN = cP = cName = cLast = cFirst = -1; }
        }
        if (hr < 0) return;
        rows.slice(hr + 1).forEach(function (row) {
          var ph = normPhone(row[cP]); if (!ph) return;
          var name = cName >= 0 ? row[cName] : ((cLast >= 0 ? row[cLast] : '') + ' ' + (cFirst >= 0 ? row[cFirst] : ''));
          found.push({ nid: cN >= 0 ? String(row[cN]).replace(/\D/g, '') : '', name: nrm(name), phone: ph });
        });
      });
      var byNid = {}, byName = {}, cnt = {};
      S.students.forEach(function (s) { if (s.nid) byNid[s.nid] = s; var k = nrm(s.name); cnt[k] = (cnt[k] || 0) + 1; byName[k] = s; });
      var items = [], miss = 0, seen = {};
      found.forEach(function (x) {
        var s = (x.nid && byNid[x.nid]) || (cnt[x.name] === 1 ? byName[x.name] : null);
        if (!s) { miss++; return; } if (seen[s.id]) return; seen[s.id] = 1;
        items.push({ id: s.id, phone: x.phone, name: s.name, label: s.label, old: s.phone });
      });
      var changed = items.filter(function (i) { return i.phone !== i.old; });
      $('#xprev').innerHTML = !found.length ? '<p class="note" style="color:var(--bad)">لم أجد عمود «هاتف الولي» فيه أرقام نقالة صحيحة.</p>' :
        '<p class="note">وجدت <b>' + found.length + '</b> رقما: <b>' + items.length + '</b> تلميذ مطابق (' + changed.length + ' جديد أو متغيّر)' + (miss ? '، و<b>' + miss + '</b> لم أجد تلميذه في دفتر الغيابات' : '') + '.</p>' +
        (changed.length ? '<button class="btn ok" id="xs">حفظ ' + changed.length + ' رقم</button>' : '');
      if ($('#xs')) $('#xs').onclick = function () {
        var b = this; b.setAttribute('aria-busy', '1');
        api('savePhones', { items: changed.map(function (i) { return { id: i.id, phone: i.phone }; }) }).then(function (r) { toast(r.message); parentsView(); }).catch(function (e) { b.removeAttribute('aria-busy'); toast(e.message, 1); });
      };
    } catch (e) { toast('تعذرت قراءة الملف: ' + e.message, 1); }
  };
  fr.readAsArrayBuffer(f);
}

/* ---------- الإعدادات ---------- */
function settingsView() {
  shell('<div class="card"><p class="note">جارٍ التحميل…</p></div>');
  api('settings').then(function (d) {
    var demo = { 'التلميذ': 'بركات محمد', 'القسم': '1م1', 'التاريخ': '30/10', 'اليوم': 'الخميس', 'المادة': 'رياضيات', 'البداية': '08:00', 'النهاية': '09:00' };
    var h = '<div class="card"><h2>1. ربط هاتف المؤسسة</h2><p class="note">على هاتف المؤسسة (الذي فيه الشريحة): ثبّت تطبيق «مرسل رسائل الغيابات»، ثم افتح هذه الصفحة <b>من متصفح نفس الهاتف</b> واضغط «ربط هذا الهاتف». أو انسخ رابط الربط والصقه في التطبيق.</p>' +
      (d.pair ? '<div class="row"><a class="btn ok" target="_top" href="intent://pair?l=' + encodeURIComponent(d.pair) + '#Intent;scheme=daftarsms;package=dz.school.attendance.sms;end">ربط هذا الهاتف</a>' +
        '<button class="btn soft" id="cp">نسخ رابط الربط</button></div><textarea id="pt" readonly rows="3" class="ltr" style="font-size:.75rem">' + esc(d.pair) + '</textarea>'
        : '<p class="note" style="color:var(--bad)">انشر التطبيق أولا (نشر ← نشر جديد ← تطبيق ويب) ثم أعد فتح الصفحة من رابط /exec.</p>') +
      '<button class="btn sm soft" id="nk" style="align-self:flex-start">رابط ربط جديد (يوقف الهاتف المربوط حاليا)</button></div>';
    h += '<div class="card"><h2>2. نص الرسالة</h2><label class="switch"><input type="checkbox" id="en"' + (d.enabled ? ' checked' : '') + '> تفعيل إرسال الرسائل للأولياء</label>' +
      '<label>النص — يمكن استعمال: {التلميذ} {القسم} {التاريخ} {اليوم} {المادة} {البداية} {النهاية}<textarea id="tp">' + esc(d.template) + '</textarea></label>' +
      '<p class="note">مثال: <span id="sm"></span></p><p class="note" id="ln"></p>' +
      '<div class="row"><button class="btn" id="sv">حفظ</button><button class="btn soft" id="df" style="flex:0 0 auto">النص الافتراضي</button></div></div>';
    h += '<div class="card"><h2>3. وضع التجربة</h2><p class="note">ترسل رسالة إلى أي رقم فورا، دون انتظار غياب حقيقي (يجب أن يكون هاتف المؤسسة مربوطا ومشغّلا).</p>' +
      '<form id="tf" class="card" style="padding:0;border:0"><div class="row"><label>رقم المستقبِل<input name="phone" class="ltr" inputmode="tel" placeholder="0664172468"></label>' +
      '<label>الاسم (للسجل)<input name="name" placeholder="ولي بركات محمد"></label></div>' +
      '<label>النص<textarea name="text">رسالة تجريبية من متوسطة الشهيد بدراني بوعمامة: خدمة إشعار الأولياء بغياب أبنائهم. لا داعي للرد.</textarea></label>' +
      '<button class="btn ok">إرسال تجريبي</button></form></div>';
    h += '<div class="card"><h2>4. ملف دفتر الغيابات</h2><p class="note">' + (d.daftar_url ? '✓ مربوط: <a href="' + esc(d.daftar_url) + '" target="_blank" rel="noopener">' + esc(d.daftar_name) + '</a> (قراءة فقط)' : '✗ غير محدد') + '</p>' +
      '<form id="dfm" class="row"><input name="link" class="ltr" placeholder="https://docs.google.com/spreadsheets/d/…"><button class="btn soft" style="flex:0 0 auto">حفظ الرابط</button></form></div>';
    shell(h);
    var tp = $('#tp');
    function upd() {
      var t = tp.value.replace(/\{([^}]+)\}/g, function (m, k) { return demo[k] !== undefined ? demo[k] : m; }).replace(/\s+/g, ' ').trim();
      $('#sm').textContent = t; var p = t.length <= 70 ? 1 : Math.ceil(t.length / 67);
      $('#ln').textContent = t.length + ' حرفا = ' + p + (p === 1 ? ' رسالة' : ' أجزاء') + ' لكل ولي (الرسالة العربية 70 حرفا للجزء).';
    }
    tp.oninput = upd; upd();
    $('#df').onclick = function () { tp.value = d.default_template; upd(); };
    $('#sv').onclick = function () { api('saveSettings', { template: tp.value, enabled: $('#en').checked }).then(function (r) { toast(r.message); }).catch(function (e) { toast(e.message, 1); }); };
    $('#nk').onclick = function () { api('saveSettings', { new_key: 1 }).then(function (r) { toast(r.message); settingsView(); }).catch(function (e) { toast(e.message, 1); }); };
    if ($('#cp')) $('#cp').onclick = function () {
      var t = $('#pt'); t.focus(); t.select(); var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
      toast(ok ? 'تم نسخ رابط الربط: الصقه في تطبيق المرسل.' : 'حدّد النص وانسخه يدويا.');
    };
    $('#tf').onsubmit = function (e) { e.preventDefault(); var f = this, b = $('button', f); b.setAttribute('aria-busy', '1');
      api('test', { phone: f.phone.value, name: f.name.value, text: f.text.value }).then(function (r) { b.removeAttribute('aria-busy'); toast(r.message); }).catch(function (er) { b.removeAttribute('aria-busy'); toast(er.message, 1); }); };
    $('#dfm').onsubmit = function (e) { e.preventDefault(); api('saveSettings', { daftar_link: this.link.value }).then(function (r) { toast(r.message); settingsView(); }).catch(function (er) { toast(er.message, 1); }); };
  }).catch(function (e) { shell('<div class="card"><p class="note" style="color:var(--bad)">' + esc(e.message) + '</p></div>'); });
}

function render() {
  if (!S.token) return loginView();
  if (S.tab === 'parents') return parentsView();
  if (S.tab === 'settings') return settingsView();
  todayView();
}
render();
</script>
</body>
</html>
